
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#18324a">

<title>100번대 개인구역</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif;
  color: #fff;
  background:
    radial-gradient(circle at top, #252525, #111 65%, #080808);
}

header {
  height: 62px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #18324a;
  font-size: 22px;
  font-weight: 800;
  box-shadow: 0 2px 8px #0006;
}

main {
  max-width: 600px;
  margin: 0 auto;
  padding: 25px 18px;
}

h2 {
  margin: 10px 0 20px;
  font-size: 19px;
  color: #d5e5f2;
}

.area-card {
  display: block;
  padding: 22px 20px;
  border: 1px solid #55738b;
  border-radius: 14px;
  background: linear-gradient(145deg, #234563, #18324a);
  color: white;
  text-decoration: none;
  box-shadow: 0 4px 12px #0005;
  transition: transform .15s, background .15s;
}

.area-card:active {
  transform: scale(.98);
  background: #3374A9;
}

.card-title {
  font-size: 24px;
  font-weight: 800;
}

.card-subtitle {
  margin-top: 8px;
  font-size: 15px;
  color: #d4e4f0;
}

.arrow {
  float: right;
  font-size: 24px;
  color: #b5d2e7;
}
</style>
</head>

<body>

<header>
  100번대 개인구역
</header>

<main>

  <h2>구역 목록</h2>

  <a class="area-card" href="./136.html">

    <span class="arrow">›</span>

    <div class="card-title">
      136번 구역
    </div>

    <div class="card-subtitle">
      개인구역 봉사
    </div>

  </a>

</main>

</body>
</html>
